worker_processes auto;

# Log to stdout/stderr so `docker logs` captures everything
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include           /etc/nginx/mime.types;
    default_type      application/octet-stream;
    sendfile          on;
    keepalive_timeout 65;

    access_log /dev/stdout;

    server {
        listen 8080;
        server_name _;

        # Go backend API
        location /api/ {
            proxy_pass             http://127.0.0.1:8081;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout  5s;
            proxy_read_timeout     60s;
        }

        # WebSocket — must come before the generic /api/ block.
        # Matches /api/v1/orgs/{orgId}/runs/{runId}/stream (run live output).
        location ~ ^/api/v1/orgs/[^/]+/runs/[^/]+/stream$ {
            proxy_pass             http://127.0.0.1:8081;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade           $http_upgrade;
            proxy_set_header       Connection        "upgrade";
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout     3600s;
        }

        # Vite static bundle — SPA, so unknown paths fall back to index.html
        root  /app/frontend/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed asset files are immutable — cache aggressively
        location /assets/ {
            try_files  $uri =404;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
